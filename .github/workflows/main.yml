name: semProject workflow
on:
  push:
    branches:
      - master

jobs:
  UnitTests:
    name: Unit Test Build Action
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Run unit tests and generate coverage
        run: mvn clean verify -Dtest=UnitTests
      - name: Upload unit-test coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: target/site/jacoco/jacoco.xml
          flags: unit
          fail_ci_if_error: true
          verbose: true

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Start database
        run: docker compose up -d db
      - name: Run integration tests and generate coverage
        run: mvn clean verify -Dtest=IntegrationTest
      - name: Upload integration-test coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: target/site/jacoco/jacoco.xml
          flags: integration
          fail_ci_if_error: true
          verbose: true
      - name: Stop database
        if: always()
        run: docker compose down

  Build:
    name: Build and Start Using docker-compose
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Package and Run docker compose
        run: |
          mvn package -DskipTests
          docker compose up --abort-on-container-exit
      - name: view logs
        run: docker logs semProject-app-1
